<!DOCTYPE html>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: url('https://lh3.googleusercontent.com/rd-d/ALs6j_GH9qGnh-UfO6HCKxV_yn75kbWDWEeAEplc0SaCrUR1HoRQzZapSwfiC1C0uXORjkjlNGdUNGDyFrgkZa0zR7lm5Srwh4nBhyIGmF_C_TzlGSbw1j6iQlPQGv5HBfM0KHAJwG9ADwq9-x4-zZ9aSqSrwy1ZAGGWoV4lxLuPqFdt9zLf5w6bYbO5qsjjKmacKqicbHByDwTQBixk7y-0C0MIMslbXoMRsuKGJVRIrlGeyIgRYQCybq5d5Ub82C-lndPgUdaw620ZTyz5apP2q7BEy7IAdrbCD_lCnziIrI4mO5FP5GLlkzwqb156MKU7iWQ3OAIGKFQajdCC-ZnumRfiJCwlMSPY-GrfRKo1m-lKg1BRHZHYRH3qZH78zW-gYUtAuSjJwZmzfF1YQFfUFsbjFet6rAAXUr6bYMqf1eqrqNrrxobidMScRNLpABfx2bDXiaAV5AVJ2x_Ja-HkxoAVKbPoptedQDtRD1kDyIVlHs6QN1xJQW5vi2XlAYMaBF4_9Z-RaxMMT-JKjzOk9OHGRtsULelqR3dYVGiWPfpFkHbx0q8Lw4o9g4zOEulM_tiS3noMFCJMqQtgaZNrEwX2jA-z-0OtAqNcRrBG-BJbqhXjA4ndAiSM-ODG_o5vZUJvMfutFy8xhURwUxwnV3mD9qbXoM3Dq7mDzm190B9bBolFlt5RqmhjMrvBB5azYx0btVIrISzeYZZm-PDQvsiX8Y3_mqZ111mCMNgvRosIrYR3P5-ph0tGlfnVQ-EWGOrgQrX_M5HjEz1Nqapj4Q4qhiD1iMHoG2FxD7CTQ8Q4n7lS3zMg8W5gCs9MtOzgqB2aQR5wxe95y-bW1N43SGGi1uA6DMKzSDKHYC_845dOR2RX-I-8ntbRP6kqDNS4b0wN5pXGYe9x4OP4XYld4FMn7HWWO9JbbioncXRpQMKHSg_H0BcHFTCnT2jezxrsXE1MPSVFc4fppd9RXa8f6OLCRZx7K0uIqN8sFTpKCwd99IqFB-Uk_HquhxxWUO9Gdskwdd1nyI7p=w1920-h928') center/cover;
      display: flex;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 24px;
      box-sizing: border-box;
    }

    .list-container {
      display: grid;
      grid-template-columns: repeat(3, 180px);
      gap: 40px 60px;
      justify-content: center;
      align-items: center;
    }

    .item {
      color: #fff;
      border-radius: 12px;
      text-align: center;
      padding: 18px;
      font-size: 88px;
      font-weight: 800;
      position: relative;
      transition: all .15s ease;
      user-select: none;
    }

    .item.editing {
      color: transparent;
      -webkit-text-stroke: 3px #ffd700;
      text-stroke: 3px #ffd700;
      transform: scale(1.08);
      text-shadow: 0 0 25px rgba(255,215,0,0.6);
    }

    .note {
      margin-top: 18px;
      color: #fff;
      opacity: .9;
      font-size: 14px;
      text-align: center;
    }

    @media (max-width:640px){
      .list-container { grid-template-columns: repeat(2, 140px); gap: 24px 24px; }
      .item { font-size: 64px; }
    }
  </style>
</head>
<body>
  <div class="list-container" id="listContainer"></div>
  <!-- <div class="note">
    Tekan <b>Shift + (1–9)</b>, <b>Shift + 0</b> (10), atau <b>Shift + -</b> (11) untuk edit.<br>
    Ketik angka (max 3 digit), lalu tekan <b>Enter</b> untuk menyimpan.
  </div> -->

  <script>
    const container = document.getElementById('listContainer');
    const totalList = 11;
    const data = Array(totalList).fill('000');
    let activeIndex = null;
    let buffer = '';

    function render() {
      container.innerHTML = '';
      data.forEach((v,i) => {
        const d = document.createElement('div');
        d.className = 'item' + (i === activeIndex ? ' editing' : '');
        d.dataset.index = i;
        d.textContent = v;
        container.appendChild(d);
      });
    }

    function startEdit(idx) {
      activeIndex = idx;
      buffer = '';
      render();
    }

    function endEdit() {
      if (activeIndex !== null && buffer) {
        data[activeIndex] = buffer.padStart(3, '0');
      }
      activeIndex = null;
      buffer = '';
      render();
    }

    // Tangkap Shift + Nomor
    document.addEventListener('keydown', (e) => {
      if (e.shiftKey) {
        const code = e.code;
        let idx = null;

        if (/^Digit[1-9]$/.test(code)) {
          idx = parseInt(code.replace('Digit','')) - 1;
        } else if (code === 'Digit0') {
          idx = 9;
        } else if (code === 'Minus') {
          idx = 10;
        }

        if (idx !== null) {
          e.preventDefault();
          startEdit(idx);
          return;
        }
      }

      // Jika sedang edit — ketik angka langsung
      if (activeIndex !== null) {
        if (/^\d$/.test(e.key) && buffer.length < 3) {
          buffer += e.key;
          container.children[activeIndex].textContent = buffer.padStart(3, '0');
        } else if (e.key === 'Backspace') {
          buffer = buffer.slice(0, -1);
          container.children[activeIndex].textContent = buffer || '000';
        } else if (e.key === 'Enter') {
          endEdit();
        } else if (e.key === 'Escape') {
          activeIndex = null;
          buffer = '';
          render();
        }
      }
    });

    render();
  </script>
</body>
</html>
